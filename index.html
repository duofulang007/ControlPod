<!DOCTYPE html>
<html data-theme="light" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>ControlPod</title>
<!-- 资源版本串：改完 app.js / styles.css 要把这里的串往上滚一格 —— 串没变的话 WebView2 会继续
     用磁盘缓存里的旧文件（2026-10-04 踩过：页面一直跑改动前的旧脚本，新功能一点不生效还不报错）。
     壳每次启动还会清一次 WebView2 磁盘缓存兜底，见 MainWindow.InitWebViewAsync。 -->
<link href="styles.css?v=20261004D" rel="stylesheet">
</head>
<body>

<div class="app" id="app">

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar">
    <!-- .brand 自己就是侧栏顶棚的拖动区：::before 拖动带靠它命中（伪元素命中返回宿主元素，
         宿主不带 data-drag 就永远拖不动）。isolation:isolate 保证它内部的 z-index 不外溢，
         侧栏导航（.nav）不会被拖动带盖住。
         .brand-header 只装折叠按钮，撑出 --brand-drag-h 让它在图标条里居中也压得住拖动带。 -->
    <div class="brand" data-drag title="拖动窗口">
      <div class="brand-header">
        <button class="icon-btn side-mini" id="miniBtn" title="折叠侧边栏">
          <svg fill="none" viewBox="0 0 24 24" style="width:20px; height:20px">
            <rect height="15" rx="3" stroke="var(--ink-2)" stroke-width="1.8" width="17" x="3.5" y="4.5"/>
            <path d="M9.5 4.5v15" stroke="var(--ink-2)" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
      <div>
        <div class="name">CPod</div>
        <div class="tag">掌控主动权 · 更进一步</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="side-label">工作台</div>
      <button class="nav-item on" data-page="home">
        <svg fill="none" viewBox="0 0 24 24"><rect height="7" rx="1.8" stroke="currentColor" stroke-width="1.7" width="7" x="3.5" y="3.5"/><rect height="7" rx="1.8" stroke="currentColor" stroke-width="1.7" width="7" x="13.5" y="3.5"/><rect height="7" rx="1.8" stroke="currentColor" stroke-width="1.7" width="7" x="3.5" y="13.5"/><rect height="7" rx="1.8" stroke="currentColor" stroke-width="1.7" width="7" x="13.5" y="13.5"/></svg>
        <span>总控台</span>
      </button>
      <div class="side-label" style="margin-top:8px">工具</div>
      <button class="nav-item" data-page="projects">
        <svg fill="none" viewBox="0 0 24 24"><rect height="7" rx="2" stroke="currentColor" stroke-width="1.8" width="7" x="3" y="3.5"/><rect height="7" rx="2" stroke="currentColor" stroke-width="1.8" width="7" x="14" y="13.5"/><path d="M10 7h4.5a2.5 2.5 0 0 1 2.5 2.5V13" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/><path d="M6.5 10.5v5A2.5 2.5 0 0 0 9 18h2.5" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/></svg>
        <span>项目</span><span class="cnt" id="cntWf">3</span>
      </button>
      <div class="side-label" style="margin-top:8px">资源</div>
      <button class="nav-item" data-page="modules">
        <svg fill="none" viewBox="0 0 24 24"><path d="M12 3.2L3.6 7.4 12 11.6l8.4-4.2z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/><path d="M3.6 12L12 16.2 20.4 12" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/><path d="M3.6 16.6L12 20.8l8.4-4.2" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/></svg>
        <span>模块</span>
      </button>
      <button class="nav-item" data-page="apps">
        <svg fill="none" viewBox="0 0 24 24"><rect height="7.5" rx="2" stroke="currentColor" stroke-width="1.8" width="7.5" x="3" y="3"/><rect height="7.5" rx="2" stroke="currentColor" stroke-width="1.8" width="7.5" x="13.5" y="3"/><rect height="7.5" rx="2" stroke="currentColor" stroke-width="1.8" width="7.5" x="3" y="13.5"/><rect height="7.5" rx="2" stroke="currentColor" stroke-width="1.8" width="7.5" x="13.5" y="13.5"/></svg>
        <span>应用</span><span class="cnt" id="cntApps">12</span>
      </button>

      <div class="side-label" style="margin-top:8px">系统</div>
      <button class="nav-item" data-page="settings">
        <svg fill="none" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 12h3M13 12h7M4 17h7M17 17h3" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/><circle cx="16" cy="7" r="2.4" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="12" r="2.4" stroke="currentColor" stroke-width="1.8"/><circle cx="14" cy="17" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>设置</span>
      </button>
    </nav>

    <div class="side-div"></div>

    <div class="side-spacer"></div>

    <!-- 更新小圈：只在「有更新 / 需要执行 / 正在执行 / 更新失败」时出现（默认 hidden），
         空闲无更新时不占位、不打扰。**小圈就是进度条**：外圈圆环的弧长 = 周长 ×(1 - 进度)，
         进度由后端 phase 换算（app.js updateProgress），真实反映走到哪一步。
         圈里不写百分比 —— 数字压在 34px 的圈里既挤又假；悬停 title 才给「阶段 + 百分比」。
         data-act 复用 checkUpdate：点了走和设置页同一个确认入口，不另开一条更新链路。 -->
    <button aria-label="有可用更新" class="side-update" data-act="checkUpdate" hidden id="sideUpdate" title="有可用更新">
      <svg aria-hidden="true" class="su-ring" viewBox="0 0 40 40">
        <circle class="su-track" cx="20" cy="20" r="16"></circle>
        <circle class="su-bar" cx="20" cy="20" r="16"></circle>
      </svg>
      <span aria-hidden="true" class="su-glyph" id="sideUpdateGlyph"></span>
    </button>

    <!-- 侧栏底部原有的「头像 + 昵称 + 在线状态」用户块已整块删除（2026-10-03）：
         本机单用户应用，这几行字不携带任何可操作信息，也不反映真实账号状态。
         账号信息在「设置 → 账号」，那里有真实内容（设备管理入口）。
         删掉后侧栏底部由 .side-spacer 收尾留白。.avatar 样式保留给设置页复用。 -->
  </aside>

  <!-- ============ 主区域 ============ -->
  <div class="main">
    <header class="topbar">
      <!-- 拖动层：绝对定位铺满整条顶栏，还往外扩一圈（上到窗口最顶的系统保留区、左右到主区边缘），
           控件都压在它上面（z-index:1）所以照常能点。侧栏顶部那块的拖动层是 .brand::before。
           按下它 → chrome-command: drag → 壳用 WM_NCLBUTTONDOWN(HTCAPTION) 进入系统拖拽循环；
           双击 = 最大化 / 还原。 -->
      <div class="tb-drag" data-drag aria-hidden="true"></div>
      <div aria-label="打开指令栏" class="search" id="searchBox" role="button" tabindex="0">
        <span class="ai-spark">
          <svg fill="none" viewBox="0 0 24 24" style="width:16px; height:16px">
            <path d="M11 3.5l1.9 4.9 4.9 1.9-4.9 1.9L11 17.1l-1.9-4.9L4.2 10.3l4.9-1.9L11 3.5z" stroke="#E8402A" stroke-linejoin="round" stroke-width="1.8"/>
            <path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1z" stroke="#E8402A" stroke-linejoin="round" stroke-width="1.4"/>
          </svg>
        </span>
        <input id="searchInline" placeholder="搜索，或直接说你要做什么 —— 试试「启动晨间开工」" readonly tabindex="-1">
        <span class="kbd">Ctrl K</span>
      </div>

      <button aria-label="语音指令" class="icon-btn voice-btn" id="voiceBtn" title="语音指令：说「启动晨间开工」">
        <svg fill="none" viewBox="0 0 24 24" style="width:20px; height:20px">
          <rect height="11" rx="3" stroke="var(--ink-2)" stroke-width="1.8" width="6" x="9" y="2.5"/>
          <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" stroke="var(--ink-2)" stroke-linecap="round" stroke-width="1.8"/>
          <path d="M12 18v3.5" stroke="var(--ink-2)" stroke-linecap="round" stroke-width="1.8"/>
        </svg>
        <span class="voice-ring"></span>
      </button>

      <!-- 窗口组：置顶 · 缩小到托盘 · 全屏。三个都走壳的原生能力，不再依赖浏览器 Fullscreen API。
           组首用 margin-left:auto 把「窗口组 + 偏好组」一起推到右侧，搜索框左侧那段空白正好留给拖窗。
           三个按钮统一挂 .win-btn：悬停抬升 + 图元各自动作（图钉旋转 / 横杠下沉 / 角标呼吸），
           动效全部走 :root 的 --win-* 令牌，见 styles.css「窗口组」一节。 -->
      <button class="icon-btn win-btn win-btn-pin window-topmost" id="topmostBtn" title="窗口置顶" aria-label="窗口置顶" aria-pressed="false" disabled>
        <svg fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <g class="win-glyph">
            <path d="M8.5 4.5h7l-1 5 3 3v2h-11v-2l3-3-1-5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="win-pin-needle" d="M12 14.5V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </g>
        </svg>
        <span class="win-ring" aria-hidden="true"></span>
      </button>

      <button class="icon-btn win-btn win-btn-tray" id="trayBtn" title="缩小到托盘（后台常驻；托盘左键 / Ctrl+Alt+A 唤起）" aria-label="缩小到托盘">
        <svg fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <g class="win-glyph">
            <path class="win-tray-bar" d="M4.6 12h14.8" stroke="var(--ink-2)" stroke-linecap="round" stroke-width="1.8"/>
          </g>
        </svg>
      </button>

      <button class="icon-btn win-btn win-btn-full" id="fsBtn" title="全屏" aria-label="全屏" aria-pressed="false">
        <svg fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <g class="win-glyph">
            <path class="win-corner win-corner-tl" d="M9 3.5H4.5V8" stroke="var(--ink-2)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
            <path class="win-corner win-corner-tr" d="M15 3.5h4.5V8" stroke="var(--ink-2)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
            <path class="win-corner win-corner-bl" d="M9 20.5H4.5V16" stroke="var(--ink-2)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
            <path class="win-corner win-corner-br" d="M15 20.5h4.5V16" stroke="var(--ink-2)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
          </g>
        </svg>
      </button>

      <!-- 偏好组：主题 · 通知（左侧细竖线与窗口组分隔，见 styles.css 的 .icon-btns） -->
      <div class="icon-btns">
        <!-- 主题切换：同一套图元按 <html data-theme> 显示太阳（浅色）或月亮（深色）——
             光条在深色态收起，月盘在深色态撑开把日盘挖成月牙。JS 只写 data-theme 一个状态。 -->
        <button class="icon-btn theme-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg class="theme-ico" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" stroke="var(--ink-2)" stroke-width="1.8"/>
            <circle class="theme-moon-fill" cx="12" cy="12" r="4.2" stroke="none"/>
            <g class="theme-rays" stroke="var(--ink-2)" stroke-linecap="round" stroke-width="1.8">
              <path d="M12 2.5v2.2" style="--i:0"/>
              <path d="M12 19.3v2.2" style="--i:1"/>
              <path d="M2.5 12h2.2" style="--i:2"/>
              <path d="M19.3 12h2.2" style="--i:3"/>
              <path d="M7.95 7.95l-1.5-1.5" style="--i:4"/>
              <path d="M17.55 17.55l-1.5-1.5" style="--i:5"/>
              <path d="M16.05 7.95l1.5-1.5" style="--i:6"/>
              <path d="M6.45 16.05l1.5-1.5" style="--i:7"/>
            </g>
          </svg>
        </button>
        <button class="icon-btn" id="bellBtn" title="通知">
          <svg fill="none" viewBox="0 0 24 24" style="width:20px; height:20px">
            <path d="M6 9.5a6 6 0 1 1 12 0v4.2l1.6 2.8H4.4L6 13.7V9.5z" stroke="var(--ink-2)" stroke-linejoin="round" stroke-width="1.8"/>
            <path d="M10 19.2a2.2 2.2 0 0 0 4 0" stroke="var(--ink-2)" stroke-linecap="round" stroke-width="1.8"/>
          </svg>
          <span class="badge" id="bellBadge"></span>
        </button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<!-- ============ 命令面板 ============ -->
<div class="mask" id="paletteMask">
  <div aria-label="指令栏" class="palette" role="dialog">
    <div class="p-in">
      <span class="ai-spark">
        <svg fill="none" viewBox="0 0 24 24" style="width:17px; height:17px">
          <path d="M11 3.5l1.9 4.9 4.9 1.9-4.9 1.9L11 17.1l-1.9-4.9L4.2 10.3l4.9-1.9L11 3.5z" stroke="#E8402A" stroke-linejoin="round" stroke-width="1.8"/>
          <path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1z" stroke="#E8402A" stroke-linejoin="round" stroke-width="1.4"/>
        </svg>
      </span>
      <input autocomplete="off" id="paletteInput" placeholder="搜索，或直接说你要做什么 —— 例如「启动晨间开工」">
      <span class="kbd" id="palHint">Esc</span>
    </div>
    <div class="ai-zone" id="aiZone"></div>
    <div class="p-list" id="paletteList"></div>
  </div>
</div>

<!-- ============ 通知浮层 ============ -->
<div class="pop" id="bellPop"></div>
<div class="pop" id="voicePop"></div>
<div class="pop" id="appPop"></div>
<div class="pop" id="tagPop"></div>
<div class="pop" id="projStPop"></div>
<div class="pop" id="projSwitchPop"></div>

<!-- ============ 抽屉 ============ -->
<div class="drawer-mask" id="drawerMask"></div>
<aside aria-label="详情" class="drawer" id="drawer" role="dialog"></aside>

<!-- ============ 笔记编辑弹窗（居中模态框） ============ -->
<div class="note-mask" id="noteModalMask" data-act="closeNoteModal" aria-hidden="true"></div>
<div class="note-modal" id="noteModal" role="dialog" aria-modal="true" aria-label="笔记编辑"></div>

<!-- ============ 提示条 ============ -->
<div class="toasts" id="toasts"></div>

<script src="web/shell-bridge.js?v=20260929A"></script>
<script src="app.js?v=20261004D"></script>
</body>
</html>
